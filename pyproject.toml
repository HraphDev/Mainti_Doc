[project]
name = "bouhiaachraf-maintidocproject"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "easyocr>=1.7.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.19",
    "mlflow>=3.17.2",
    "pillow>=13.0.0",
    "pydantic>=2.7",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.13,<1.14",
    "qwen-vl-utils>=0.0.14",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.49",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintidoc"]
